name: CI/CD build, push and deploy to AKS

on:
  push:
    branches:
    #  - main

env:
  IMAGE_NAME: drilonnol/apptest
  NAMESPACE: lab-1
  DEPLOYMENT_NAME: weather-app
  CONTAINER_NAME: weather-app

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.TAG }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: 1-bd6642bf-playground-sandbox
          cluster-name: cluster1

 
      - name: Ensure namespace exists
        run: |
          kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests
        run: kubectl apply -f K8s/ -n $NAMESPACE

      - name: Update image
        run: |
          kubectl set image deployment/$DEPLOYMENT_NAME \
          $CONTAINER_NAME=${{ env.IMAGE_NAME }}:${{ env.TAG }} \
          -n $NAMESPACE

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/$DEPLOYMENT_NAME -n $NAMESPACE

      - name: Debug pods
        if: failure()
        run: |
          kubectl get pods -n $NAMESPACE
          kubectl describe deployment $DEPLOYMENT_NAME -n $NAMESPACE
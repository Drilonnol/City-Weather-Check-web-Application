name: CI/CD Pipeline

on:
  push:
    branches: [main, try-azure-cicd]
    paths-ignore:
      - 'kubernetes/**'
      - '**.md'

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set IMAGE_NAME
        run: echo "IMAGE_NAME=${REGISTRY}/$(echo ${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: type=sha,format=long

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

          provenance: true
          sbom: true

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

      - uses: mikefarah/yq@v4

      - name: Update deployment image
        env:
          IMAGE: ${{ needs.docker.outputs.image }}
        run: |
          yq e -i '.spec.template.spec.containers[0].image = strenv(IMAGE)' kubernetes/deployment.yaml

      - name: Commit & push
        run: |
          git add kubernetes/deployment.yaml
          git commit -m "deploy: update image ${IMAGE} [skip ci]" || exit 0
          git push